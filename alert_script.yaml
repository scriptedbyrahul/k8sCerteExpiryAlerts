apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-alert-script
  namespace: prod
data:
  cert_alert.py: |
    import base64
    import os
    import smtplib
    from email.mime.text import MIMEText
    import logging
    import requests
    from kubernetes import client, config
    from kubernetes.config.config_exception import ConfigException
    from cryptography import x509
    from cryptography.hazmat.backends import default_backend
    from datetime import datetime, timezone
    from tabulate import tabulate

    EMAIL_ENABLED = os.getenv("ALERT_ON_EMAIL","Not Defined")
    TEAMS_ENABLED = os.getenv("ALERT_ON_TEAMS","Not Defined")
    ENVIRONMENT  = os.getenv("ENVIRONMENT","Not Defined")
    EXPIRY_DAYS = int(os.getenv("EXPIRY_DAYS", "30"))   # <-- NEW CONFIGURABLE VALUE

    EMAIL_CONFIG = {
        'smtp_server': os.getenv('SMTP_HOST', 'smtp.sendgrid.net'),
        'smtp_port': int(os.getenv('SMTP_PORT', '587')),
        'sender': os.getenv('SMTP_FROM_EMAIL'),
        'username': os.getenv('SMTP_USER', 'apikey'),
        'password': os.getenv('SMTP_PASSWORD'),
        'recipients': [email.strip() for email in os.getenv('SMTP_TO_EMAILS', '').split(',') if email.strip()]
    }

    TEAMS_WEBHOOK_URL = os.getenv('TEAMS_WEBHOOK')

    def send_email_alert(subject, cert_list):
        if not EMAIL_ENABLED or not EMAIL_CONFIG['password'] or not EMAIL_CONFIG['recipients']:
            print('Email alert disabled or missing config.')
            return
        try:
            html = format_email_html_table(cert_list)
            msg = MIMEText(html, 'html')
            msg['Subject'] = subject
            msg['From'] = EMAIL_CONFIG['sender']
            msg['To'] = ', '.join(EMAIL_CONFIG['recipients'])
            server = smtplib.SMTP(EMAIL_CONFIG['smtp_server'], EMAIL_CONFIG['smtp_port'])
            if os.getenv('SMTP_USE_TLS', 'true').lower() == 'true':
                server.starttls()
            server.login(EMAIL_CONFIG['username'], EMAIL_CONFIG['password'])
            server.sendmail(EMAIL_CONFIG['sender'], EMAIL_CONFIG['recipients'], msg.as_string())
            server.quit()
            print('Email alert sent via SMTP.')
        except Exception as e:
            print(f'Failed to send email alert: {e}')

    def truncate(text, max_len):
        return text if len(text) <= max_len else text[:max_len - 3] + '...'

    def init_k8s():
        try:
            config.load_incluster_config()
            logging.info('Loaded in-cluster config.')
        except ConfigException:
            logging.error('Failed to load in-cluster config.')
            exit(1)

    def parse_cert_from_pem(pem_data):
        try:
            return x509.load_pem_x509_certificate(pem_data.encode(), default_backend())
        except Exception as e:
            logging.error(f'Failed to parse PEM certificate: {e}')
            return None

    def get_certificates(namespace=None):
        api = client.CustomObjectsApi()
        group = 'cert-manager.io'
        version = 'v1'
        plural = 'certificates'
        try:
            if namespace:
                certs = api.list_namespaced_custom_object(group, version, namespace, plural)
            else:
                certs = api.list_cluster_custom_object(group, version, plural)
            return certs.get('items', [])
        except Exception as e:
            logging.error(f'Error fetching cert-manager certificates: {e}')
            return []

    def get_secrets(namespace=None):
        v1 = client.CoreV1Api()
        try:
            if namespace:
                secrets = v1.list_namespaced_secret(namespace)
            else:
                secrets = v1.list_secret_for_all_namespaces()
            return secrets.items
        except Exception as e:
            logging.error(f'Error fetching secrets: {e}')
            return []

    def extract_cert_from_secret(secret):
        if secret.type != 'kubernetes.io/tls':
            return None
        crt_data = secret.data.get('tls.crt')
        if not crt_data:
            return None
        try:
            pem_bytes = base64.b64decode(crt_data).decode()
            return parse_cert_from_pem(pem_bytes)
        except Exception as e:
            logging.error(f'Failed to extract cert from secret {secret.metadata.name}: {e}')
            return None

    def extract_cert_from_certmanager(cert_obj):
        status = cert_obj.get('status', {})
        cert_b64 = status.get('certificate')
        if not cert_b64:
            return None
        try:
            pem_data = base64.b64decode(cert_b64).decode()
            return parse_cert_from_pem(pem_data)
        except Exception as e:
            logging.error(f'Failed to extract cert from cert-manager cert {cert_obj.get("metadata", {}).get("name")}: {e}')
            return None

    def get_domains(cert):
        try:
            ext = cert.extensions.get_extension_for_class(x509.SubjectAlternativeName)
            return ext.value.get_values_for_type(x509.DNSName)
        except Exception:
            try:
                return [cert.subject.get_attributes_for_oid(x509.NameOID.COMMON_NAME)[0].value]
            except Exception:
                return []

    def get_days_until_expiry(cert):
        expire_date = cert.not_valid_after_utc
        now = datetime.now(timezone.utc)
        return (expire_date - now).days

    def format_email_html_table(cert_list):
        html = """
        <html>
        <body>
        <h2>Certificate Expiry Alert</h2>
        <table border="1" cellpadding="5" cellspacing="0" style="border-collapse: collapse;">
          <thead>
            <tr>
              <th>Cert Name</th>
              <th>Domains</th>
              <th>Days Left</th>
              <th>Expiry (UTC)</th>
              <th>Namespace</th>
            </tr>
          </thead>
          <tbody>
        """
        for item in cert_list:
            html += f"""
            <tr>
              <td>{truncate(item['name'], 25)}</td>
              <td>{truncate(', '.join(item['domains']), 40)}</td>
              <td>{item['days_remaining']}</td>
              <td>{item['expiry_date'].strftime('%Y-%m-%d')}</td>
              <td>{item['namespace']}</td>
            </tr>
            """
        html += """
          </tbody>
        </table>
        </body>
        </html>
        """
        return html

    def format_for_teams_table(cert_list):
        headers = ['Cert Name', 'Domains', 'Days Left', 'Expiry (UTC)', 'Namespace']
        rows = []
        for item in cert_list:
            rows.append([
                truncate(item['name'], 25),
                truncate(', '.join(item['domains']), 40),
                item['days_remaining'],
                item['expiry_date'].strftime('%Y-%m-%d'),
                item['namespace']
            ])
        table_text = tabulate(rows, headers=headers, tablefmt='grid')
        return f"```\n{table_text}\n```"

    def send_teams_alert(cert_list, subject=None):
        subject = f"Alert : Certificate Expiring on {ENVIRONMENT} environment"
        if not TEAMS_ENABLED or not TEAMS_WEBHOOK_URL:
            return
        try:
            if cert_list:
                body = format_for_teams_table(cert_list)
            else:
                body = f"✅ No certificates are expiring in the next {EXPIRY_DAYS} days."
            message = f"**{subject}**\n\n{body}"
            payload = {'text': message}
            resp = requests.post(TEAMS_WEBHOOK_URL, json=payload)
            if resp.status_code == 200:
                print('Teams alert sent.')
            else:
                print(f'Teams alert failed with status code {resp.status_code}')
        except Exception as e:
          print(f'Failed to send Teams alert: {e}')

    def main():
        logging.basicConfig(level=logging.INFO)
        init_k8s()

        namespace = None  
        days_before_expiry = EXPIRY_DAYS   # <-- USE ENV VALUE

        all_certs = []

        certs = get_certificates(namespace)
        for cert_obj in certs:
            cert = extract_cert_from_certmanager(cert_obj)
            if cert:
                all_certs.append({
                    'name': cert_obj['metadata']['name'],
                    'namespace': cert_obj['metadata']['namespace'],
                    'expiry_date': cert.not_valid_after_utc,
                    'days_remaining': get_days_until_expiry(cert),
                    'domains': get_domains(cert)
                })

        secrets = get_secrets(namespace)
        for secret in secrets:
            cert = extract_cert_from_secret(secret)
            if cert:
                all_certs.append({
                    'name': secret.metadata.name,
                    'namespace': secret.metadata.namespace,
                    'expiry_date': cert.not_valid_after_utc,
                    'days_remaining': get_days_until_expiry(cert),
                    'domains': get_domains(cert)
                })

        if not all_certs:
            print('No certificates found.')
            return

        print('\nAll Certificates:\n')
        print(tabulate([
            [truncate(c['name'], 25), truncate(', '.join(c['domains']), 40), c['days_remaining'], c['expiry_date'].strftime('%Y-%m-%d'), c['namespace']]
            for c in all_certs
        ], headers=['Cert Name', 'Domains', 'Days Left', 'Expiry (UTC)', 'Namespace'], tablefmt='fancy_grid'))

        expiring = [c for c in all_certs if c['days_remaining'] <= days_before_expiry]

        if expiring:
            print(f'\nExpiring Certificates (<= {days_before_expiry} days):\n')
            print(tabulate([
                [truncate(c['name'], 25), truncate(', '.join(c['domains']), 40), c['days_remaining'], c['expiry_date'].strftime('%Y-%m-%d'), c['namespace']]
                for c in expiring
            ], headers=['Cert Name', 'Domains', 'Days Left', 'Expiry (UTC)', 'Namespace'], tablefmt='fancy_grid'))

            alert_msg_subject = f'Alert : Certificate Expiring on {ENVIRONMENT} Environment'
            send_email_alert(alert_msg_subject, expiring)
            send_teams_alert(expiring)

    if __name__ == '__main__':
        main()
