apiVersion: v1
kind: ServiceAccount
metadata:
  name: certread-sa
  namespace: prod

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certread-role
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "get", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certread-alert-binding
subjects:
  - kind: ServiceAccount
    name: certread-sa
    namespace: prod
roleRef:
  kind: ClusterRole
  name: certread-role
  apiGroup: rbac.authorization.k8s.io
